  <body>
    <div class="page">
      <header class="masthead">
        <h1>Samesy Day</h1>
        <p>The day your pet becomes older than you.</p>
      </header>

      <main>
        <form id="pet-form" class="sentence" autocomplete="off">
          <span>My</span>
          <label>
            <span class="sr-only">Kind of pet</span>
            <select id="species" name="species">
              <option value="dog">dog</option>
              <option value="cat">cat</option>
            </select>
          </label>
          <label>
            <span class="sr-only">Pet's name</span>
            <input id="pet-name" class="name-input" name="petName" type="text" placeholder="name" maxlength="24">
          </label>
          <span>is about</span>
          <label>
            <span class="sr-only">Pet's age in years</span>
            <input id="pet-age" class="age-input" name="petAge" type="number" inputmode="decimal" min="0" max="40" step="0.5" value="3">
          </label>
          <span>and I'm</span>
          <label>
            <span class="sr-only">Your age in years</span>
            <input id="human-age" class="age-input" name="humanAge" type="number" inputmode="numeric" min="1" max="120" step="1" value="34">
          </label>
        </form>

        <section class="result" aria-live="polite" aria-atomic="true">
          <h2 id="headline"></h2>
          <p id="detail"></p>
        </section>

        <div id="actions" class="actions">
          <button id="share-button" type="button">Share the card</button>
          <button id="calendar-button" type="button">Put it on my calendar</button>
        </div>
      </main>

      <footer>
        <p>Based on the usual 7-to-1 folklore, not science. What you type stays in your browser.</p>
        <p>Made by <a href="https://merimerimeri.com/">MeriMeriMeri Software</a></p>
      </footer>
    </div>
  </body>
</html>
